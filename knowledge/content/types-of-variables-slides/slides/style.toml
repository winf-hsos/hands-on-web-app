# Style of the decks of Hands-on Data Science: black slides, the area's dark
# blue (#3d8fc4 on dark, #0b6aa2 on light, as on the platform) for references
# and accents. [colors.groups] are the colours of R's vector types in this
# deck: double orange, character purple, integer teal; logical is yellow.
[colors]
background = "000000"
white = "FFFFFF"
gray_light = "B6BEC6"
gray = "7D868F"
gray_dark = "4A5259"
blue = "3D8FC4"
green = "4ADE80"
yellow = "FFD23F"
red = "EF4444"

[colors.groups]
g1 = "FB923C"
g2 = "C084FC"
g3 = "2DD4BF"

[colors.light]
background = "FFFFFF"
white = "1F2933"
gray_light = "4A5259"
gray = "7D868F"
gray_dark = "C5CCD3"
blue = "0B6AA2"
green = "15803D"
yellow = "08527E"
red = "B91C1C"

[fonts]
text = "Arial"
code = "Roboto Mono"

[sizes]
large = 40
normal = 24
small = 16
tiny = 10

[stagekit]
language = "en"
