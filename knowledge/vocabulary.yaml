# Closed lists used by the knowledge base, with labels in both languages.
# The website builds its filters from this file; a new entry here needs no
# change to the code. Proposal of 2026-10-21, see docs/knowledge-schema.md.

# `icon` names an icon from Lucide (https://lucide.dev/icons); the build
# checks that it exists.
types:
  lesson:     { de: Lektion,         en: Lesson,     icon: book-open }
  demo:       { de: Demo,            en: Demo,       icon: circle-play }
  experiment: { de: Experiment,      en: Experiment, icon: flask-conical }
  term:       { de: Begriff,         en: Term,       icon: tag }
  story:      { de: Geschichte,      en: Story,      icon: history }
  tool:       { de: Werkzeug,        en: Tool,       icon: wrench }
  quiz:       { de: Quiz,            en: Quiz,       icon: circle-question-mark }
  exercise:   { de: Übung,           en: Exercise,   icon: square-terminal }
  source:     { de: Literaturquelle, en: Source,     icon: book-marked }
  paper:      { de: Paper,           en: Paper,      icon: file-text }
  person:     { de: Person,          en: Person,     icon: user-round }
  slides:     { de: Folien,          en: Slides,     icon: presentation }
  dataset:    { de: Datensatz,       en: Data set,   icon: table }

# Each relation is stored at A and points to B; `inverse` is how B shows it.
relations:
  requires:
    de: Setzt voraus
    en: Requires
    inverse: { de: Darauf baut auf, en: Builds on this }
  deepens:
    de: Vertieft
    en: Deepens
    inverse: { de: Vertieft durch, en: Deepened by }
  example_of:
    de: Beispiel für
    en: Example of
    inverse: { de: Beispiele, en: Examples }
  part_of:
    de: Gehört zu
    en: Part of
    inverse: { de: Teile, en: Parts }
  checks:
    de: Prüft
    en: Checks
    inverse: { de: Teste dich selbst, en: Test yourself }
  see_also:
    de: Siehe auch
    en: See also
    symmetric: true

levels:
  1: { de: Einstieg,        en: Beginner }
  2: { de: Grundlagen,      en: Foundations }
  3: { de: Fortgeschritten, en: Advanced }
  4: { de: Vertiefung,      en: Expert }

# Topics are the questions a learner can start from. The first five follow
# the families of the LiFi concept map, rephrased for this platform. They
# have no colours on the site (decision of Nicolas, 2026-10-26). Further
# topics name a subject of their own, such as a programming language.
topics:
  solving-problems:         { de: Probleme lösen,         en: Solving problems }
  representing-information: { de: Information darstellen, en: Representing information }
  storing-information:      { de: Information speichern,  en: Storing information }
  transferring-information: { de: Information übertragen, en: Transferring information }
  processing-information:   { de: Information verarbeiten, en: Processing information }
  programming-with-python:  { de: Programmieren mit Python, en: Programming with Python }
  # Data science, after the topic map of the Data Analytics material
  # (02 - Lehrinhalte\Data Analytics\Themenlandkarte.md, fields A to M and X)
  questions-and-measurement: { de: "Fragen, Designs und Messung", en: "Questions, designs and measurement" }
  reproducible-work:         { de: Arbeitsumgebung und Reproduzierbarkeit, en: Working environment and reproducibility }
  programming-with-r:        { de: Programmieren mit R, en: Programming with R }
  getting-data:              { de: Daten beschaffen und aufräumen, en: Getting and tidying data }
  transforming-data:         { de: Daten transformieren und verknüpfen, en: Transforming and joining data }
  exploring-data:            { de: Explorieren und beschreiben, en: Exploring and describing }
  visualising-data:          { de: Visualisieren, en: Visualising }
  communicating-results:     { de: Kommunizieren und schreiben, en: Communicating and writing }
  text-with-rules:           { de: Text regelbasiert auswerten, en: Text with rules }
  nlp-and-ml:                { de: NLP und maschinelles Lernen, en: NLP and machine learning }
  llms-in-analysis:          { de: Sprachmodelle in der Analyse, en: Language models in analysis }
  ai-agents-as-tools:        { de: KI-Agenten als Werkzeug, en: AI agents as tools }
  big-data-pipelines:        { de: Große Daten und Pipelines, en: Big data and pipelines }
  data-pitfalls:             { de: Datenkritik und Fallstricke, en: Data criticism and pitfalls }

# Areas of the platform: one app, one knowledge base, a part of the site for
# each area with its own address (/cs/…, /ds/…), start page and accent colour.
# Content, paths, courses and projects name their areas with `areas:`
# (default: cs), so the same item can appear in both.
areas:
  cs: { de: Hands-on Computer Science, en: Hands-on Computer Science, short: Computer Science }
  ds: { de: Hands-on Data Science, en: Hands-on Data Science, short: Data Science }

# Institutions that offer courses: name, address and a logo from media/.
institutions:
  hs-osnabrueck:
    de: Hochschule Osnabrück
    en: Osnabrück University of Applied Sciences
    url: https://www.hs-osnabrueck.de/
    logo: hs-osnabrueck.svg

modules:
  dup: { de: Digitalisierung und Programmierung, en: Digitalisation and Programming }
  wmg: { de: Werkzeuge der Markt- und Gesellschaftsforschung, en: Tools of Market and Social Research }
  pmg: { de: Praxis der Markt- und Gesellschaftsforschung, en: Practice of Market and Social Research }
  ea: { de: Empirisches Arbeiten, en: Empirical Research }
  bda: { de: Big Data Analytics, en: Big Data Analytics }
